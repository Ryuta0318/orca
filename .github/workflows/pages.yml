name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/inspiring-pascal-8fsplg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css core.js features.js tools.js tools2.js onhand.js loader.js settings.js app.js assets _site/
          # Cache-bust: browsers keep Pages files for ~10 min, so tag our JS/CSS with the commit
          sed -i -E "s#(src|href)=\"([a-z0-9]+)\.(js|css)\"#\1=\"\2.\3?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -o '[a-z0-9]*\.\(js\|css\)?v=[0-9a-f]*' _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
