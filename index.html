<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORCA</title>
<meta name="description" content="ホテル運営の社内ナレッジとツールをひとつにまとめる社内ポータル">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/orca-mark-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/orca-mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- ORCA_BODY_START -->
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="メインメニュー">
    <a class="brand" href="#home" aria-label="ORCA ホーム">
      <img class="brand-mark" src="assets/orca-mark.webp" alt="" width="72" height="72">
      <span class="wordmark" role="img" aria-label="ORCA"></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <a class="me" href="#settings">
        <span class="avatar">RS</span>
        <span class="me-name">Ryuta Suzuki</span>
        <svg class="i chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
      </a>
      <a class="nav-link small" href="#settings" data-view="settings">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Settings</span>
      </a>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="メニューを開く" aria-controls="sidebar" aria-expanded="false">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="wordmark top-wordmark only-mobile" href="#home" role="img" aria-label="ORCA"></a>
      <div class="topbar-actions">
        <button class="icon-btn" id="notifBtn" type="button" aria-label="お知らせ" aria-controls="notifPop">
          <svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          <span class="dot" id="notifDot" hidden></span>
        </button>
        <a class="avatar soft hide-mobile" href="#settings" aria-label="設定">RS</a>
        <a class="icon-btn hide-mobile" href="#welcome" aria-label="ログアウト">
          <svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </a>
        <a class="icon-btn only-mobile" href="#chat" aria-label="新しいチャット">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </a>
        <div class="popover" id="notifPop" hidden></div>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<section class="welcome" id="welcome" hidden aria-label="ようこそ">
  <img class="welcome-mark" src="assets/orca-mark.webp" alt="" width="220" height="220">
  <span class="wordmark welcome-wordmark" role="img" aria-label="ORCA"></span>
  <p class="welcome-tag">All connects here.</p>
  <p class="welcome-sub">つながる。ひろがる。動き出す。</p>
  <div class="welcome-actions">
    <a class="btn btn-dark" href="#home">はじめる <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a class="btn btn-ghost" href="#home">ログイン</a>
  </div>
  <p class="welcome-note">関係者限定です。URLを共有しないでください。</p>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="core.js"></script>
<script src="features.js"></script>
<script src="loader.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
<!-- ORCA_BODY_END -->
</body>
</html>
